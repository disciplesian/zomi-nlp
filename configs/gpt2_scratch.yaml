# Small GPT-2 style causal LM trained from scratch with the custom SentencePiece tokenizer
task: clm
model_name: gpt2-scratch
tokenizer: models/tokenizer   # output of zomi_nlp.train_tokenizer
output_dir: models/gpt2-zomi
max_length: 128
architecture:
  n_layer: 6
  n_head: 8
  n_embd: 384
full:
  epochs: 20
  batch_size: 32
  learning_rate: 5.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
smoke:
  epochs: 1
  batch_size: 4
  max_train_samples: 64
  max_eval_samples: 32
  max_length: 32
  architecture:
    n_layer: 2
    n_head: 2
    n_embd: 64
