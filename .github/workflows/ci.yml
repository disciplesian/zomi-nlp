name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: PYTHONPATH=src python -m pytest -q
      - name: Extract + parse sample files (.docx and .doc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          mkdir -p /tmp/sample/raw
          cp "data/raw/01- TCGESTv-OL.docx" "data/raw/03- TCLEVSTv-OL.doc" /tmp/sample/raw/
          PYTHONPATH=src python -m zomi_nlp.build_all \
            --raw-dir /tmp/sample/raw --interim-dir /tmp/sample/interim --out-dir /tmp/sample/out
          test -s /tmp/sample/out/zomi_bible.jsonl
