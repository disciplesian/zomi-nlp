name: Train

# GitHub-hosted runners are CPU-only: "smoke" mode is meant for them. For "full" training use a
# self-hosted GPU runner (runs-on label below), or Hugging Face Spaces / AutoTrain / Colab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (tiny CPU check) or full
        type: choice
        options: [smoke, full]
        default: smoke
      config:
        description: Training config
        type: choice
        options: [configs/gpt2_scratch.yaml, configs/mlm_xlmr.yaml]
        default: configs/gpt2_scratch.yaml
      model_name:
        description: Pretrained model name (MLM configs only; blank = config default)
        type: string
        default: ""
      epochs:
        description: Epochs (blank = config default)
        type: string
        default: ""
      push_to_hub:
        description: Push tokenizer and model to Hugging Face (private)
        type: boolean
        default: false
      runner:
        description: Runner (edit this list to add your self-hosted GPU label)
        type: choice
        options: [ubuntu-latest]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  train:
    runs-on: ${{ inputs.runner }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install LibreOffice (for legacy .doc files)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - run: python -m zomi_nlp.build_all
      - run: python -m zomi_nlp.train_tokenizer
      - name: Train and evaluate
        env:
          CONFIG: ${{ inputs.config }}
          MODE: ${{ inputs.mode }}
          MODEL_NAME: ${{ inputs.model_name }}
          EPOCHS: ${{ inputs.epochs }}
        run: |
          args=(--config "$CONFIG" --mode "$MODE")
          [ -n "$MODEL_NAME" ] && args+=(--model-name "$MODEL_NAME")
          [ -n "$EPOCHS" ] && args+=(--epochs "$EPOCHS")
          python -m zomi_nlp.train_lm "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            reports/
            models/
            !models/**/checkpoints/**
      - name: Push to Hugging Face
        if: ${{ inputs.push_to_hub && env.HF_TOKEN != '' }}
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          model_dir=$(python -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['output_dir'])" "$CONFIG")
          python -m zomi_nlp.push_to_hub --what tokenizer model --model-dir "$model_dir"
