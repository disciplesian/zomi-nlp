name: Build dataset

on:
  push:
    paths:
      - "data/raw/**"
  workflow_dispatch:
    inputs:
      push_to_hub:
        description: Push the dataset to Hugging Face (private)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install LibreOffice (for legacy .doc files)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: pip install -r requirements-train.txt
      - name: Extract, parse and build dataset
        run: PYTHONPATH=src python -m zomi_nlp.build_all
      - uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: |
            data/processed/
            reports/
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports DATASET_CARD.md
          git diff --cached --quiet || (git commit -m "Update dataset reports [skip ci]" && git pull --rebase && git push)
      - name: Push dataset to Hugging Face
        if: ${{ inputs.push_to_hub && env.HF_TOKEN != '' }}
        run: PYTHONPATH=src python -m zomi_nlp.push_to_hub --what dataset
